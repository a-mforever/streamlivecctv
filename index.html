<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>Minecraft LIVE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #080808;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    header {
      height: 64px;
      min-height: 64px;
      background: #111111;
      border-bottom: 1px solid #292929;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 21px;
      font-weight: 700;
    }

    .minecraft-icon {
      width: 34px;
      height: 34px;
      background:
        linear-gradient(135deg, #5b8c3a 0%, #6fa849 48%, #777 49%, #777 100%);
      border: 2px solid #222;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.18);
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #191919;
      border: 1px solid #303030;
      border-radius: 7px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 700;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #555;
    }

    .live-status.live .live-dot {
      background: #ff3030;
      box-shadow: 0 0 10px rgba(255, 48, 48, 0.8);
      animation: pulse 1.4s infinite;
    }

    .live-status.live .live-text {
      color: #ff4a4a;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: 0.45;
      }
    }

    /* MAIN */

    main {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, #181818 0%, #0b0b0b 55%, #050505 100%);
    }

    /* VIDEO */

    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #050505;
      display: block;
    }

    /* PLACEHOLDER */

    .waiting {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .waiting-box {
      width: min(90%, 520px);
      text-align: center;
      padding: 35px 30px;
      background: rgba(17, 17, 17, 0.92);
      border: 1px solid #303030;
      border-radius: 12px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.55);
    }

    .waiting-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .waiting-text {
      color: #999;
      font-size: 15px;
      line-height: 1.5;
    }

    .loading {
      width: 38px;
      height: 38px;
      margin: 0 auto 20px;
      border: 4px solid #333;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* CONTROLS */

    .controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 14px 18px;

      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.92),
        rgba(0, 0, 0, 0)
      );

      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .video-container:hover .controls,
    .controls.visible {
      opacity: 1;
    }

    .control-left,
    .control-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      border: 1px solid #383838;
      background: rgba(25, 25, 25, 0.95);
      color: white;
      border-radius: 7px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 13px;
      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    button:hover {
      background: #292929;
      border-color: #555;
    }

    button:active {
      transform: translateY(1px);
    }

    .connection {
      font-size: 12px;
      color: #888;
      margin-left: 6px;
    }

    .connection.connected {
      color: #55d66b;
    }

    .connection.error {
      color: #ff5252;
    }

    /* FOOTER */

    footer {
      height: 42px;
      min-height: 42px;
      background: #111111;
      border-top: 1px solid #292929;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 12px;
    }

    /* FULLSCREEN */

    :fullscreen .video-container {
      width: 100vw;
      height: 100vh;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      header {
        height: 56px;
        min-height: 56px;
        padding: 0 14px;
      }

      .logo {
        font-size: 17px;
      }

      .minecraft-icon {
        width: 28px;
        height: 28px;
      }

      .live-status {
        padding: 7px 9px;
      }

      footer {
        height: 36px;
        min-height: 36px;
      }

      .waiting-box {
        padding: 28px 20px;
      }

      .waiting-title {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <div class="minecraft-icon"></div>
      <span>Minecraft LIVE</span>
    </div>

    <div class="live-status" id="liveStatus">
      <span class="live-dot"></span>
      <span class="live-text" id="liveText">OFFLINE</span>
    </div>
  </header>


  <main>

    <div
      class="video-container"
      id="videoContainer"
    >

      <!--
        HIER KOMMT SPÄTER DER ECHTE MINECRAFT-STREAM REIN.
        Der PC-Streamer liefert den MediaStream an dieses Video-Element.
      -->

      <video
        id="liveVideo"
        autoplay
        playsinline
        muted
      ></video>


      <div
        class="waiting"
        id="waiting"
      >
        <div class="waiting-box">

          <div class="loading"></div>

          <div class="waiting-title">
            Minecraft LIVE
          </div>

          <div class="waiting-text" id="waitingText">
            Warte auf die Verbindung zu deinem Minecraft-Stream...
          </div>

        </div>
      </div>


      <div class="controls" id="controls">

        <div class="control-left">

          <button id="playButton">
            ▶ Start
          </button>

          <button id="muteButton">
            🔇 Ton
          </button>

          <span
            class="connection"
            id="connectionStatus"
          >
            Verbindung wird hergestellt...
          </span>

        </div>


        <div class="control-right">

          <button id="fullscreenButton">
            ⛶ Vollbild
          </button>

        </div>

      </div>

    </div>

  </main>


  <footer>
    Minecraft LIVE · Web Stream
  </footer>


  <script>
    /*
      ============================================================
      MINECRAFT LIVE WEB PLAYER
      ============================================================

      Der eigentliche WebRTC-Streamer wird im nächsten Schritt
      angeschlossen.

      Aktuell:
      - Video Player vorhanden
      - LIVE/OFFLINE Status vorhanden
      - Vollbild vorhanden
      - Tonsteuerung vorhanden
      - Verbindungsstatus vorhanden
      - Wartebild vorhanden
    */


    const video = document.getElementById("liveVideo");
    const waiting = document.getElementById("waiting");
    const waitingText = document.getElementById("waitingText");

    const liveStatus = document.getElementById("liveStatus");
    const liveText = document.getElementById("liveText");

    const connectionStatus =
      document.getElementById("connectionStatus");

    const playButton =
      document.getElementById("playButton");

    const muteButton =
      document.getElementById("muteButton");

    const fullscreenButton =
      document.getElementById("fullscreenButton");

    const videoContainer =
      document.getElementById("videoContainer");

    const controls =
      document.getElementById("controls");


    /*
      ------------------------------------------------------------
      LIVE STATUS
      ------------------------------------------------------------
    */

    function setLive(isLive) {

      if (isLive) {

        liveStatus.classList.add("live");
        liveText.textContent = "LIVE";

        waiting.style.display = "none";

        connectionStatus.textContent =
          "Verbunden";

        connectionStatus.className =
          "connection connected";

      } else {

        liveStatus.classList.remove("live");
        liveText.textContent = "OFFLINE";

        waiting.style.display = "flex";

        connectionStatus.textContent =
          "Offline";

        connectionStatus.className =
          "connection";

      }
    }


    /*
      ------------------------------------------------------------
      VIDEO EVENTS
      ------------------------------------------------------------
    */

    video.addEventListener("playing", () => {

      setLive(true);

      playButton.textContent = "❚❚ Pause";

    });


    video.addEventListener("pause", () => {

      if (video.srcObject) {
        playButton.textContent = "▶ Start";
      }

    });


    video.addEventListener("waiting", () => {

      if (video.srcObject) {

        waiting.style.display = "flex";

        waitingText.textContent =
          "Der Minecraft-Stream lädt...";

      }

    });


    video.addEventListener("canplay", () => {

      if (video.srcObject) {

        waiting.style.display = "none";

      }

    });


    video.addEventListener("error", () => {

      setLive(false);

      waitingText.textContent =
        "Der Minecraft-Stream konnte nicht geladen werden.";

      connectionStatus.textContent =
        "Fehler";

      connectionStatus.className =
        "connection error";

    });


    /*
      ------------------------------------------------------------
      PLAY / PAUSE
      ------------------------------------------------------------
    */

    playButton.addEventListener("click", async () => {

      try {

        if (video.paused) {

          await video.play();

          playButton.textContent =
            "❚❚ Pause";

        } else {

          video.pause();

          playButton.textContent =
            "▶ Start";

        }

      } catch (error) {

        console.error(
          "Video konnte nicht gestartet werden:",
          error
        );

      }

    });


    /*
      ------------------------------------------------------------
      MUTE
      ------------------------------------------------------------
    */

    muteButton.addEventListener("click", () => {

      video.muted = !video.muted;

      if (video.muted) {

        muteButton.textContent =
          "🔇 Ton";

      } else {

        muteButton.textContent =
          "🔊 Ton";

      }

    });


    /*
      ------------------------------------------------------------
      FULLSCREEN
      ------------------------------------------------------------
    */

    fullscreenButton.addEventListener("click", async () => {

      try {

        if (!document.fullscreenElement) {

          await videoContainer.requestFullscreen();

          fullscreenButton.textContent =
            "✕ Vollbild";

        } else {

          await document.exitFullscreen();

          fullscreenButton.textContent =
            "⛶ Vollbild";

        }

      } catch (error) {

        console.error(
          "Vollbild konnte nicht geöffnet werden:",
          error
        );

      }

    });


    document.addEventListener(
      "fullscreenchange",
      () => {

        if (!document.fullscreenElement) {

          fullscreenButton.textContent =
            "⛶ Vollbild";

        }

      }
    );


    /*
      ------------------------------------------------------------
      CONTROLS EINBLENDEN
      ------------------------------------------------------------
    */

    let controlsTimer;

    videoContainer.addEventListener(
      "mousemove",
      () => {

        controls.classList.add("visible");

        clearTimeout(controlsTimer);

        controlsTimer = setTimeout(() => {

          controls.classList.remove("visible");

        }, 2500);

      }
    );


    /*
      ------------------------------------------------------------
      WEBRTC STARTPUNKT
      ------------------------------------------------------------

      Sobald unser Minecraft-Streamer verbunden ist,
      wird hier der echte MediaStream eingesetzt:

          video.srcObject = remoteStream;

      Danach:

          setLive(true);

      Der folgende Teil ist absichtlich noch leer,
      damit die Seite bereits funktioniert, bevor
      der Stream-Server eingerichtet ist.
    */


    function setMinecraftStream(stream) {

      if (!stream) {
        return;
      }

      video.srcObject = stream;

      video.muted = false;

      video.play()
        .then(() => {

          setLive(true);

        })
        .catch(error => {

          console.error(
            "Stream konnte nicht abgespielt werden:",
            error
          );

          setLive(true);

        });

    }


    /*
      ------------------------------------------------------------
      STARTZUSTAND
      ------------------------------------------------------------
    */

    setLive(false);


    /*
      ============================================================
      WICHTIG
      ============================================================

      Diese Website ist jetzt der PLAYER.

      Der nächste technische Teil ist:

      Minecraft (CurseForge)
             ↓
      OBS / Screen Capture
             ↓
      WebRTC
             ↓
      GitHub-Seite
             ↓
      Zuschauer

      Dafür müssen wir noch den Stream-Sender bauen.
      ============================================================
    */

  </script>

</body>
</html>
