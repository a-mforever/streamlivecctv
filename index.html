<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCTV Live</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

#viewer {
    position: fixed;
    inset: 0;
    background: #000;
}

#remoteVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

#liveBadge {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 20;

    display: flex;
    align-items: center;
    gap: 7px;

    padding: 7px 10px;
    border-radius: 5px;

    background: rgba(0,0,0,.65);
    color: white;

    font-size: 12px;
    font-weight: bold;
    letter-spacing: .5px;
}

#cameraIcon {
    font-size: 13px;
}

#liveDot {
    width: 7px;
    height: 7px;
    background: #ff2222;
    border-radius: 50%;
}

#textOverlay {
    position: fixed;
    left: 50%;
    bottom: 9%;
    transform: translateX(-50%);

    z-index: 30;

    max-width: 85%;

    padding: 12px 22px;

    background: rgba(0,0,0,.78);
    color: white;

    border-radius: 8px;

    font-size: clamp(18px, 3vw, 34px);
    font-weight: bold;
    text-align: center;

    opacity: 0;
    transition: opacity .4s ease;

    pointer-events: none;
}

#textOverlay.show {
    opacity: 1;
}

#privacy {
    position: fixed;
    inset: 0;

    z-index: 100;

    background: #000;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-direction: column;

    opacity: 0;
    pointer-events: none;

    transition: opacity 1s ease;
}

#privacy.active {
    opacity: 1;
    pointer-events: all;
}

#privacyWarning {
    color: #fff;
    font-size: clamp(25px, 5vw, 60px);
    font-weight: bold;
    letter-spacing: 4px;
}

#privacyText {
    margin-top: 15px;
    color: #aaa;
    font-size: 14px;
    letter-spacing: 2px;
}

#senderPanel {
    position: fixed;
    inset: 0;

    z-index: 200;

    background: #111;
    color: white;

    display: none;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;
}

#senderPanel h1 {
    margin-bottom: 10px;
}

#senderPanel p {
    color: #aaa;
    max-width: 600px;
    line-height: 1.5;
}

#startButton {
    margin-top: 20px;

    padding: 14px 25px;

    border: 0;
    border-radius: 7px;

    background: #19c45b;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

#startButton:hover {
    background: #15a84d;
}

#senderStatus {
    margin-top: 15px;
    color: #aaa;
}

#hiddenLocalVideo {
    display: none;
}
</style>
</head>

<body>

<div id="viewer">

    <video
        id="remoteVideo"
        autoplay
        playsinline
        muted
    ></video>

    <div id="liveBadge">
        <span id="cameraIcon">▣</span>
        <span>LIVE</span>
        <span id="liveDot"></span>
    </div>

    <div id="textOverlay"></div>

    <div id="privacy">
        <div id="privacyWarning">STREAM SICHTSCHUTZ</div>
        <div id="privacyText">Die Übertragung wird kurz ausgeblendet.</div>
    </div>

</div>

<video id="hiddenLocalVideo" autoplay muted playsinline></video>

<div id="senderPanel">

    <h1>CCTV Stream Sender</h1>

    <p>
        Dieser Browser ist als Stream-Sender eingerichtet.
        Starte die Bildschirmübertragung und wähle deinen Minecraft-Bildschirm aus.
    </p>

    <button id="startButton">
        STREAM STARTEN
    </button>

    <div id="senderStatus">
        Sender wird vorbereitet...
    </div>

</div>

<script>

const STREAM_ID = "amforever-cctv-live-928374";

const isSender =
    new URLSearchParams(window.location.search).get("send") === "1";

const remoteVideo =
    document.getElementById("remoteVideo");

const senderPanel =
    document.getElementById("senderPanel");

const startButton =
    document.getElementById("startButton");

const senderStatus =
    document.getElementById("senderStatus");

const hiddenLocalVideo =
    document.getElementById("hiddenLocalVideo");

const textOverlay =
    document.getElementById("textOverlay");

const privacy =
    document.getElementById("privacy");

let peer = null;
let screenStream = null;

let textTimer = null;
let privacyTimer = null;


/* =========================================================
   SENDER
========================================================= */

if (isSender) {

    senderPanel.style.display = "flex";

    senderStatus.textContent =
        "Verbinde mit dem Stream-Server...";

    startSender();

}


/* =========================================================
   SENDER START
========================================================= */

function startSender() {

    peer = new Peer(STREAM_ID, {

        debug: 2

    });


    peer.on("open", id => {

        console.log("Sender online:", id);

        senderStatus.textContent =
            "Sender online. Klicke auf STREAM STARTEN.";

    });


    peer.on("error", error => {

        console.error("PeerJS Fehler:", error);

        if (error.type === "unavailable-id") {

            senderStatus.textContent =
                "Sender-ID ist bereits aktiv. Alte Sender-Seite schließen und neu laden.";

            startButton.disabled = true;

        } else {

            senderStatus.textContent =
                "Verbindungsfehler: " + error.type;

        }

    });


    peer.on("connection", connection => {

        console.log(
            "Regie verbunden:",
            connection.peer
        );

        connection.on("open", () => {

            console.log("Regie-Verbindung geöffnet.");

        });


        connection.on("data", data => {

            console.log("Regie-Befehl:", data);

            if (!data || !data.type) {
                return;
            }


            if (data.type === "text") {

                showText(
                    data.text,
                    data.duration || 10000
                );

            }


            if (data.type === "privacy") {

                showPrivacy(
                    data.duration || 10000
                );

            }

        });

    });


    peer.on("call", call => {

        console.log(
            "Zuschauer möchte den Stream sehen:",
            call.peer
        );

        if (!screenStream) {

            console.log(
                "Noch kein Bildschirmstream vorhanden."
            );

            return;

        }

        call.answer(screenStream);

    });

}


/* =========================================================
   SCREEN START
========================================================= */

startButton.addEventListener("click", async () => {

    try {

        screenStream =
            await navigator.mediaDevices.getDisplayMedia({

                video: {
                    frameRate: {
                        ideal: 30,
                        max: 60
                    }
                },

                audio: false

            });


        hiddenLocalVideo.srcObject =
            screenStream;


        senderPanel.style.display =
            "none";


        console.log(
            "Bildschirmübertragung gestartet."
        );


        senderStatus.textContent =
            "Stream läuft.";


        const videoTrack =
            screenStream.getVideoTracks()[0];


        videoTrack.addEventListener(
            "ended",
            () => {

                screenStream = null;

                senderPanel.style.display =
                    "flex";

                senderStatus.textContent =
                    "Bildschirmübertragung beendet.";

            }
        );


    } catch (error) {

        console.error(error);

        senderStatus.textContent =
            "Bildschirmaufnahme wurde nicht gestartet.";

    }

});


/* =========================================================
   VIEWER
========================================================= */

if (!isSender) {

    startViewer();

}


function startViewer() {

    peer = new Peer({

        debug: 1

    });


    peer.on("open", myId => {

        console.log(
            "Viewer verbunden:",
            myId
        );


        connectToStream(myId);

    });


    peer.on("error", error => {

        console.error(
            "Viewer PeerJS Fehler:",
            error
        );

        setTimeout(() => {

            if (!screenStream) {
                startViewer();
            }

        }, 4000);

    });

}


function connectToStream(myId) {

    console.log(
        "Verbinde mit Sender:",
        STREAM_ID
    );


    const call =
        peer.call(
            STREAM_ID,
            new MediaStream()
        );


    call.on("stream", stream => {

        console.log(
            "STREAM EMPFANGEN"
        );

        remoteVideo.srcObject =
            stream;

        remoteVideo.play()
            .catch(() => {});

    });


    call.on("close", () => {

        console.log(
            "Stream-Verbindung geschlossen."
        );

        remoteVideo.srcObject = null;

        setTimeout(() => {

            if (!isSender) {

                reconnectViewer();

            }

        }, 3000);

    });


    call.on("error", error => {

        console.error(
            "Call Fehler:",
            error
        );

        setTimeout(() => {

            if (!isSender) {

                reconnectViewer();

            }

        }, 3000);

    });

}


function reconnectViewer() {

    try {

        if (peer) {
            peer.destroy();
        }

    } catch (e) {}

    startViewer();

}


/* =========================================================
   TEXT
========================================================= */

function showText(text, duration) {

    clearTimeout(textTimer);

    textOverlay.textContent =
        text;

    textOverlay.classList.add("show");


    textTimer =
        setTimeout(() => {

            textOverlay.classList.remove("show");

        }, duration);

}


/* =========================================================
   SICHTSCHUTZ
========================================================= */

function showPrivacy(duration) {

    clearTimeout(privacyTimer);

    privacy.classList.add("active");


    privacyTimer =
        setTimeout(() => {

            privacy.classList.remove("active");

        }, duration);

}

</script>

</body>
</html>
