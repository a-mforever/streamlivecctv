<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCTV Stream</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

#app{
    position:relative;
    width:100vw;
    height:100vh;
    background:#000;
}

video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

#remoteVideo{
    display:none;
}

#localVideo{
    display:none;
}

/* =========================================================
   WAITING
========================================================= */

#waiting{
    position:absolute;
    inset:0;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#000;
    color:#fff;
}

.signal{
    width:16px;
    height:16px;
    border-radius:50%;
    background:#e00000;
    box-shadow:0 0 18px #e00000;
    margin-bottom:18px;
}

#waitingText{
    font-size:18px;
    letter-spacing:3px;
    text-align:center;
}

/* =========================================================
   START
========================================================= */

#startBox{
    position:absolute;
    left:50%;
    bottom:35px;
    transform:translateX(-50%);
    z-index:20;
    display:block;
}

button{
    border:1px solid rgba(255,255,255,.35);
    background:rgba(15,15,15,.9);
    color:#fff;
    padding:13px 22px;
    border-radius:5px;
    cursor:pointer;
    font-size:14px;
}

button:hover{
    background:#292929;
}

/* =========================================================
   LIVE BADGE
========================================================= */

#liveBadge{
    position:absolute;
    top:18px;
    left:18px;
    z-index:15;
    display:none;
    align-items:center;
    gap:8px;
    color:#fff;
    font-size:12px;
    letter-spacing:2px;
    background:rgba(0,0,0,.55);
    padding:7px 10px;
    border-radius:3px;
}

#liveDot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#e00000;
    box-shadow:0 0 10px #e00000;
}

/* =========================================================
   REGIE TEXT
========================================================= */

#regieText{
    position:absolute;

    left:50%;
    bottom:7%;

    transform:translateX(-50%) translateY(80px);

    z-index:40;

    width:max-content;
    max-width:82%;

    color:#fff;

    font-size:clamp(18px,2.8vw,38px);
    font-weight:600;

    line-height:1.2;

    text-align:center;

    padding:10px 22px;

    background:rgba(0,0,0,.72);

    border-left:3px solid #e00000;

    border-radius:3px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.9);

    opacity:0;

    pointer-events:none;
}

/* EINFLIEGEN */

#regieText.show{
    animation:
        textIn .65s cubic-bezier(.2,.8,.2,1)
        forwards;
}

/* AUSFLIEGEN */

#regieText.hide{
    animation:
        textOut .55s cubic-bezier(.6,0,.8,.2)
        forwards;
}

@keyframes textIn{

    0%{
        opacity:0;
        transform:
            translateX(-50%)
            translateY(80px);
    }

    60%{
        opacity:1;
    }

    100%{
        opacity:1;
        transform:
            translateX(-50%)
            translateY(0);
    }
}

@keyframes textOut{

    0%{
        opacity:1;
        transform:
            translateX(-50%)
            translateY(0);
    }

    100%{
        opacity:0;
        transform:
            translateX(-50%)
            translateY(70px);
    }
}

/* =========================================================
   SICHTSCHUTZ
========================================================= */

#privacy{
    position:absolute;
    inset:0;
    z-index:50;

    background:#000;

    color:#fff;

    display:none;

    align-items:center;
    justify-content:center;
    flex-direction:column;
}

#privacySignal{
    width:24px;
    height:24px;
    border-radius:50%;

    background:#e00000;

    box-shadow:
        0 0 30px #e00000;

    animation:
        blink .7s infinite alternate;

    margin-bottom:24px;
}

#privacyTitle{
    font-size:25px;
    letter-spacing:5px;
}

#privacySub{
    margin-top:12px;
    color:#888;
    font-size:12px;
    letter-spacing:2px;
}

@keyframes blink{
    from{
        opacity:.35;
    }

    to{
        opacity:1;
    }
}
</style>
</head>

<body>

<div id="app">

    <video
        id="remoteVideo"
        autoplay
        playsinline>
    </video>

    <video
        id="localVideo"
        autoplay
        muted
        playsinline>
    </video>

    <div id="waiting">

        <div class="signal"></div>

        <div id="waitingText">
            STREAM IST OFFLINE
        </div>

    </div>

    <div id="startBox">

        <button id="startButton">
            STREAM STARTEN
        </button>

    </div>

    <div id="liveBadge">

        <span id="liveDot"></span>

        <span>LIVE</span>

    </div>

    <div id="regieText"></div>

    <div id="privacy">

        <div id="privacySignal"></div>

        <div id="privacyTitle">
            STREAM SICHTSCHUTZ
        </div>

        <div id="privacySub">
            ÜBERTRAGUNG VORÜBERGEHEND AUSGEBLENDET
        </div>

    </div>

</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://zxaczahnnnztcglsinej.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_K9b2XabV1bJz9oCj7W6eaQ_AtBeXzm4";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

/* =========================================================
   EINSTELLUNGEN
========================================================= */

const ROOM =
    "cctv-live-stream";

const rtcConfig = {

    iceServers:[
        {
            urls:
                "stun:stun.l.google.com:19302"
        },
        {
            urls:
                "stun:stun1.l.google.com:19302"
        }
    ]

};

/* =========================================================
   ELEMENTE
========================================================= */

const remoteVideo =
    document.getElementById(
        "remoteVideo"
    );

const localVideo =
    document.getElementById(
        "localVideo"
    );

const waiting =
    document.getElementById(
        "waiting"
    );

const waitingText =
    document.getElementById(
        "waitingText"
    );

const startBox =
    document.getElementById(
        "startBox"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const liveBadge =
    document.getElementById(
        "liveBadge"
    );

const regieText =
    document.getElementById(
        "regieText"
    );

const privacy =
    document.getElementById(
        "privacy"
    );

/* =========================================================
   VARIABLEN
========================================================= */

let channel = null;

let isStreamer = false;

let stream = null;

let streamerSession = null;

let viewerId =
    "viewer-" +
    crypto.randomUUID();

let viewerPeer = null;

let viewerConnected = false;

const streamerPeers =
    new Map();

/* =========================================================
   CHANNEL VERBINDEN
========================================================= */

async function connectChannel(){

    channel =
        supabaseClient.channel(
            ROOM,
            {
                config:{
                    broadcast:{
                        self:false
                    }
                }
            }
        );

    channel.on(
        "broadcast",
        {
            event:"signal"
        },
        ({payload})=>{

            handleSignal(
                payload
            );

        }
    );

    channel.on(
        "broadcast",
        {
            event:"command"
        },
        ({payload})=>{

            handleCommand(
                payload
            );

        }
    );

    channel.subscribe(
        status=>{

            console.log(
                "Supabase:",
                status
            );

            if(
                status ===
                "SUBSCRIBED"
            ){

                console.log(
                    "CCTV Channel verbunden"
                );

                requestStreamer();

            }

        }
    );
}

/* =========================================================
   SENDEN
========================================================= */

async function sendSignal(
    payload
){

    if(!channel)return;

    await channel.send({

        type:"broadcast",

        event:"signal",

        payload

    });
}

async function sendCommand(
    payload
){

    if(!channel)return;

    await channel.send({

        type:"broadcast",

        event:"command",

        payload

    });
}

/* =========================================================
   STREAMER SUCHEN
========================================================= */

function requestStreamer(){

    if(isStreamer)return;

    sendSignal({

        type:"viewer-join",

        viewerId

    });
}

/* =========================================================
   STREAM STARTEN
========================================================= */

startButton.addEventListener(
    "click",
    async ()=>{

        if(isStreamer)return;

        try{

            stream =
                await navigator
                .mediaDevices
                .getDisplayMedia({

                    video:{
                        frameRate:{
                            ideal:30,
                            max:60
                        }
                    },

                    audio:false

                });

            if(!stream)return;

            isStreamer = true;

            streamerSession =
                crypto.randomUUID();

            localVideo.srcObject =
                stream;

            localVideo.style.display =
                "block";

            remoteVideo.style.display =
                "none";

            waiting.style.display =
                "none";

            startBox.style.display =
                "none";

            liveBadge.style.display =
                "flex";

            const track =
                stream
                .getVideoTracks()[0];

            if(track){

                track.addEventListener(
                    "ended",
                    stopStreamer
                );

            }

            await sendSignal({

                type:
                    "streamer-online",

                sessionId:
                    streamerSession

            });

            console.log(
                "STREAMER ONLINE"
            );

        }catch(error){

            console.error(
                "Bildschirmfreigabe:",
                error
            );

            waiting.style.display =
                "flex";

            waitingText.textContent =
                "STREAM IST OFFLINE";

        }

    }
);

/* =========================================================
   STREAM STOPPEN
========================================================= */

async function stopStreamer(){

    if(!isStreamer)return;

    isStreamer = false;

    for(
        const pc of
        streamerPeers.values()
    ){

        try{
            pc.close();
        }catch{}

    }

    streamerPeers.clear();

    if(stream){

        stream
        .getTracks()
        .forEach(track=>{

            try{
                track.stop();
            }catch{}

        });

    }

    stream = null;

    localVideo.srcObject =
        null;

    localVideo.style.display =
        "none";

    liveBadge.style.display =
        "none";

    startBox.style.display =
        "block";

    waiting.style.display =
        "flex";

    waitingText.textContent =
        "STREAM IST OFFLINE";

    await sendSignal({

        type:
            "streamer-offline",

        sessionId:
            streamerSession

    });

    streamerSession = null;
}

/* =========================================================
   SIGNALING
========================================================= */

async function handleSignal(
    message
){

    if(
        !message ||
        !message.type
    )return;

    /* STATUS */

    if(
        message.type ===
        "status-request"
    ){

        if(isStreamer){

            await sendSignal({

                type:
                    "streamer-status",

                online:true,

                sessionId:
                    streamerSession

            });

        }

        return;
    }

    /* =====================================================
       STREAMER
    ===================================================== */

    if(isStreamer){

        if(
            message.type ===
            "viewer-join"
        ){

            if(
                !message.viewerId
            )return;

            await createViewerConnection(
                message.viewerId
            );

            return;
        }

        if(
            message.type ===
            "viewer-answer"
        ){

            const pc =
                streamerPeers.get(
                    message.viewerId
                );

            if(!pc)return;

            try{

                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        message.answer
                    )
                );

            }catch(error){

                console.error(
                    "Answer Fehler:",
                    error
                );

            }

            return;
        }

        if(
            message.type ===
            "viewer-ice"
        ){

            const pc =
                streamerPeers.get(
                    message.viewerId
                );

            if(
                !pc ||
                !message.candidate
            )return;

            try{

                await pc.addIceCandidate(
                    new RTCIceCandidate(
                        message.candidate
                    )
                );

            }catch(error){

                console.error(
                    "ICE Fehler:",
                    error
                );

            }

            return;
        }

        return;
    }

    /* =====================================================
       VIEWER
    ===================================================== */

    if(
        message.type ===
        "streamer-online"
    ){

        requestStreamer();

        return;
    }

    if(
        message.type ===
        "streamer-offline"
    ){

        closeViewer();

        waiting.style.display =
            "flex";

        waitingText.textContent =
            "STREAM IST OFFLINE";

        liveBadge.style.display =
            "none";

        return;
    }

    if(
        message.type ===
        "streamer-offer"
    ){

        if(
            message.targetViewerId !==
            viewerId
        )return;

        await handleStreamerOffer(
            message
        );

        return;
    }

    if(
        message.type ===
        "streamer-ice"
    ){

        if(
            message.targetViewerId !==
            viewerId
        )return;

        if(
            !viewerPeer ||
            !message.candidate
        )return;

        try{

            await viewerPeer.addIceCandidate(
                new RTCIceCandidate(
                    message.candidate
                )
            );

        }catch(error){

            console.error(
                "Viewer ICE:",
                error
            );

        }

    }

}

/* =========================================================
   STREAMER → VIEWER
========================================================= */

async function createViewerConnection(
    targetViewerId
){

    if(!stream)return;

    const old =
        streamerPeers.get(
            targetViewerId
        );

    if(old){

        try{
            old.close();
        }catch{}

    }

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );

    streamerPeers.set(
        targetViewerId,
        pc
    );

    stream
    .getTracks()
    .forEach(track=>{

        pc.addTrack(
            track,
            stream
        );

    });

    pc.onicecandidate =
        event=>{

            if(
                !event.candidate
            )return;

            sendSignal({

                type:
                    "streamer-ice",

                targetViewerId,

                candidate:
                    event.candidate
                    .toJSON()

            });

        };

    pc.onconnectionstatechange =
        ()=>{

            console.log(
                "Viewer:",
                targetViewerId,
                pc.connectionState
            );

            if(
                pc.connectionState ===
                    "failed" ||
                pc.connectionState ===
                    "closed"
            ){

                streamerPeers.delete(
                    targetViewerId
                );

            }

        };

    try{

        const offer =
            await pc.createOffer();

        await pc.setLocalDescription(
            offer
        );

        await sendSignal({

            type:
                "streamer-offer",

            targetViewerId,

            sessionId:
                streamerSession,

            offer:
                pc.localDescription
                .toJSON()

        });

    }catch(error){

        console.error(
            "Offer Fehler:",
            error
        );

    }
}

/* =========================================================
   VIEWER EMPFÄNGT STREAM
========================================================= */

async function handleStreamerOffer(
    message
){

    closeViewer();

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );

    viewerPeer = pc;

    pc.ontrack =
        event=>{

            let incomingStream;

            if(
                event.streams &&
                event.streams[0]
            ){

                incomingStream =
                    event.streams[0];

            }else{

                incomingStream =
                    new MediaStream();

                incomingStream.addTrack(
                    event.track
                );

            }

            remoteVideo.srcObject =
                incomingStream;

            remoteVideo.style.display =
                "block";

            waiting.style.display =
                "none";

            liveBadge.style.display =
                "flex";

            viewerConnected = true;

            remoteVideo
                .play()
                .catch(()=>{});

        };

    pc.onicecandidate =
        event=>{

            if(
                !event.candidate
            )return;

            sendSignal({

                type:
                    "viewer-ice",

                viewerId,

                candidate:
                    event.candidate
                    .toJSON()

            });

        };

    pc.onconnectionstatechange =
        ()=>{

            console.log(
                "WebRTC:",
                pc.connectionState
            );

            if(
                pc.connectionState ===
                "connected"
            ){

                viewerConnected = true;

            }

            if(
                pc.connectionState ===
                    "failed" ||
                pc.connectionState ===
                    "disconnected" ||
                pc.connectionState ===
                    "closed"
            ){

                viewerConnected = false;

                closeViewer();

                waiting.style.display =
                    "flex";

                waitingText.textContent =
                    "VERBINDUNG WIRD HERGESTELLT...";

                setTimeout(
                    requestStreamer,
                    1500
                );

            }

        };

    try{

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                message.offer
            )
        );

        const answer =
            await pc.createAnswer();

        await pc.setLocalDescription(
            answer
        );

        await sendSignal({

            type:
                "viewer-answer",

            viewerId,

            answer:
                pc.localDescription
                .toJSON()

        });

    }catch(error){

        console.error(
            "WebRTC Fehler:",
            error
        );

        closeViewer();

        waitingText.textContent =
            "VERBINDUNG FEHLGESCHLAGEN";

    }

}

/* =========================================================
   VIEWER SCHLIESSEN
========================================================= */

function closeViewer(){

    viewerConnected = false;

    if(viewerPeer){

        try{
            viewerPeer.close();
        }catch{}

    }

    viewerPeer = null;

    remoteVideo.srcObject =
        null;

    remoteVideo.style.display =
        "none";
}

/* =========================================================
   REGIE-BEFEHLE
========================================================= */

function handleCommand(
    command
){

    if(
        !command ||
        !isStreamer
    )return;

    if(
        command.type ===
        "text"
    ){

        showRegieText(
            command.text
        );

    }

    if(
        command.type ===
        "privacy"
    ){

        showPrivacy();

    }

}

/* =========================================================
   TEXT-ANIMATION
========================================================= */

let textTimer = null;

/* 
   Falls gerade ein alter Text läuft,
   Animation komplett zurücksetzen.
*/

function showRegieText(
    text
){

    if(!text)return;

    clearTimeout(
        textTimer
    );

    regieText.classList.remove(
        "show",
        "hide"
    );

    /*
       Browser-Reflow erzwingen,
       damit die Animation auch bei
       mehreren schnellen Texten
       jedes Mal neu startet.
    */

    void regieText.offsetWidth;

    regieText.textContent =
        text;

    regieText.classList.add(
        "show"
    );

    /*
       Nach 10 Sekunden
       rausfliegen lassen.
    */

    textTimer =
        setTimeout(()=>{

            regieText.classList.remove(
                "show"
            );

            void regieText.offsetWidth;

            regieText.classList.add(
                "hide"
            );

        },10000);

}

/* =========================================================
   SICHTSCHUTZ
========================================================= */

let privacyTimer = null;

function showPrivacy(){

    clearTimeout(
        privacyTimer
    );

    privacy.style.display =
        "flex";

    privacyTimer =
        setTimeout(()=>{

            privacy.style.display =
                "none";

        },10000);

}

/* =========================================================
   START
========================================================= */

connectChannel();

</script>

</body>
</html>
