<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CCTV LIVE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      position: relative;
    }

    /* ================================
       STREAM
    ================================= */

    #video {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      object-fit: contain;

      background: #000;
    }


    /* ================================
       CCTV / LIVE OVERLAY
    ================================= */

    #overlay {
      position: fixed;

      top: 20px;
      left: 20px;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 9px 12px;

      background: rgba(5, 5, 5, 0.82);

      border: 1px solid rgba(32, 217, 91, 0.45);

      border-radius: 7px;

      color: white;

      font-size: 14px;
      font-weight: 800;

      letter-spacing: 0.3px;

      z-index: 10;

      user-select: none;
      pointer-events: none;
    }


    /* grüner CCTV-Punkt */

    #cctvDot {
      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: #20d95b;

      box-shadow:
        0 0 8px rgba(32, 217, 91, 0.9);
    }


    /* LIVE */

    #liveBadge {
      padding: 5px 8px;

      background: #e83232;

      border-radius: 5px;

      font-size: 12px;
      font-weight: 900;

      color: white;
    }


    /* ================================
       OFFLINE / WARTEN
    ================================= */

    #waiting {
      position: fixed;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;

      z-index: 5;
    }


    #waitingBox {
      text-align: center;

      padding: 25px 30px;

      background: #101010;

      border: 1px solid #292929;

      border-radius: 10px;

      color: white;
    }


    #waitingTitle {
      font-size: 21px;
      font-weight: 700;

      margin-bottom: 8px;
    }


    #waitingText {
      color: #888;

      font-size: 13px;
    }


    /* ================================
       LADEKREIS
    ================================= */

    #loader {
      width: 32px;
      height: 32px;

      margin: 0 auto 17px;

      border: 4px solid #292929;

      border-top-color: #20d95b;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }


    @keyframes spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }


    /* ================================
       STREAM STARTEN
    ================================= */

    #startButton {
      position: fixed;

      left: 50%;
      bottom: 30px;

      transform: translateX(-50%);

      z-index: 20;

      padding: 11px 18px;

      background: #151515;

      color: white;

      border: 1px solid #333;

      border-radius: 7px;

      cursor: pointer;

      font-size: 13px;
      font-weight: 700;
    }


    #startButton:hover {
      background: #242424;
    }


    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 600px) {

      #overlay {
        top: 10px;
        left: 10px;

        padding: 7px 9px;

        font-size: 12px;
      }

      #liveBadge {
        font-size: 11px;

        padding: 4px 6px;
      }

    }

  </style>
</head>


<body>


  <!-- =================================
       MINECRAFT VIDEO
  ================================== -->

  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>


  <!-- =================================
       CCTV / LIVE
  ================================== -->

  <div id="overlay">

    <span id="cctvDot"></span>

    <span>CCTV</span>

    <span id="liveBadge">
      LIVE
    </span>

  </div>


  <!-- =================================
       WARTEN
  ================================== -->

  <div id="waiting">

    <div id="waitingBox">

      <div id="loader"></div>

      <div id="waitingTitle">
        Minecraft LIVE
      </div>

      <div id="waitingText">
        Warte auf den Stream...
      </div>

    </div>

  </div>


  <!-- =================================
       STREAM STARTEN
       NUR FÜR DEN STREAMER
  ================================== -->

  <button id="startButton">
    STREAM STARTEN
  </button>


  <script>

    /*
    ============================================================
    MINECRAFT CCTV LIVE
    ============================================================

    KEIN AUDIO

    Es wird ausschließlich Video übertragen.

    Der Bildschirm wird mit getDisplayMedia()
    aufgenommen.

    ============================================================
    */


    const video =
      document.getElementById("video");

    const waiting =
      document.getElementById("waiting");

    const startButton =
      document.getElementById("startButton");

    const overlay =
      document.getElementById("overlay");


    let stream = null;


    /*
    ============================================================
    STREAM STARTEN
    ============================================================
    */

    startButton.addEventListener(
      "click",
      async () => {

        try {

          /*
          ---------------------------------------------
          Bildschirm auswählen
          ---------------------------------------------

          WICHTIG:

          audio: false

          Dadurch wird KEIN Ton aufgenommen.
          */

          stream =
            await navigator.mediaDevices
              .getDisplayMedia({

                video: {
                  frameRate: {
                    ideal: 30,
                    max: 60
                  }
                },

                audio: false

              });


          /*
          ---------------------------------------------
          VIDEO ANZEIGEN
          ---------------------------------------------
          */

          video.srcObject =
            stream;


          video.muted =
            true;


          await video.play();


          /*
          ---------------------------------------------
          WARTEN-BILDSCHIRM AUSBLENDEN
          ---------------------------------------------
          */

          waiting.style.display =
            "none";


          /*
          ---------------------------------------------
          STARTBUTTON AUSBLENDEN
          ---------------------------------------------
          */

          startButton.style.display =
            "none";


          /*
          ---------------------------------------------
          STREAM ENDE
          ---------------------------------------------
          */

          const track =
            stream.getVideoTracks()[0];


          if (track) {

            track.addEventListener(
              "ended",
              stopStream
            );

          }

        }

        catch (error) {

          console.error(
            "Stream konnte nicht gestartet werden:",
            error
          );

        }

      }
    );


    /*
    ============================================================
    STREAM STOPPEN
    ============================================================
    */

    function stopStream() {

      if (stream) {

        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );

        stream =
          null;

      }


      video.srcObject =
        null;


      waiting.style.display =
        "flex";


      startButton.style.display =
        "block";

    }


    /*
    ============================================================
    WICHTIG
    ============================================================

    Aktuell wird das Minecraft-Bild lokal im Browser
    angezeigt.

    Für die echte Übertragung an andere Besucher muss
    der MediaStream noch über WebRTC weitergereicht werden.

    Das kommt als nächster Teil.

    ============================================================
    */

  </script>

</body>
</html>
