<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CCTV Regie</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    min-height:100%;
    background:#090909;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    padding:25px;
}

.wrapper{
    width:min(900px,100%);
    margin:auto;
}

header{
    border-bottom:1px solid #333;
    padding-bottom:18px;
    margin-bottom:25px;
}

.title{
    font-size:28px;
    font-weight:bold;
    letter-spacing:4px;
}

.subtitle{
    color:#777;
    margin-top:7px;
    font-size:12px;
    letter-spacing:2px;
}

.status{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px;
    background:#111;
    border:1px solid #292929;
    border-radius:5px;
    margin-bottom:20px;
}

.statusDot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#777;
}

.statusDot.online{
    background:#00d26a;
    box-shadow:0 0 12px rgba(0,210,106,.7);
}

.panel{
    background:#111;
    border:1px solid #292929;
    border-radius:5px;
    padding:20px;
    margin-bottom:20px;
}

.panelTitle{
    font-size:12px;
    letter-spacing:2px;
    color:#999;
    margin-bottom:14px;
}

textarea{
    width:100%;
    min-height:100px;
    resize:vertical;
    border:1px solid #333;
    background:#080808;
    color:#fff;
    padding:13px;
    border-radius:4px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:15px;
    outline:none;
}

textarea:focus{
    border-color:#666;
}

button{
    border:1px solid #3a3a3a;
    background:#191919;
    color:#fff;
    border-radius:4px;
    padding:11px 16px;
    margin-top:10px;
    margin-right:6px;
    cursor:pointer;
}

button:hover{
    background:#292929;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

button.danger{
    border-color:#7b2222;
    background:#270c0c;
}

button.danger:hover{
    background:#421010;
}

.quick{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.quick button{
    margin:0;
}

.log{
    background:#050505;
    border:1px solid #222;
    border-radius:4px;
    padding:12px;
    height:180px;
    overflow-y:auto;
    font-family:Consolas,monospace;
    font-size:12px;
    color:#888;
}

.logLine{
    margin-bottom:6px;
}

.logLine.good{
    color:#66d98b;
}

.logLine.bad{
    color:#e86b6b;
}
</style>
</head>

<body>

<div class="wrapper">

<header>
    <div class="title">CCTV REGIE</div>
    <div class="subtitle">
        LIVE STREAM STEUERUNG
    </div>
</header>

<div class="status">

    <div
        id="statusDot"
        class="statusDot">
    </div>

    <div id="statusText">
        Verbindung wird hergestellt...
    </div>

</div>

<div class="panel">

    <div class="panelTitle">
        TEXT EINBLENDEN
    </div>

    <textarea
        id="textInput"
        placeholder="Text eingeben..."></textarea>

    <button
        id="sendText"
        disabled>
        TEXT SENDEN
    </button>

</div>

<div class="panel">

    <div class="panelTitle">
        SCHNELLTEXT
    </div>

    <div class="quick">

        <button
            class="quickText"
            data-text="BIN GLEICH WIEDER DA">
            BIN GLEICH WIEDER DA
        </button>

        <button
            class="quickText"
            data-text="KURZE PAUSE">
            KURZE PAUSE
        </button>

        <button
            class="quickText"
            data-text="STREAM LÄUFT">
            STREAM LÄUFT
        </button>

    </div>

</div>

<div class="panel">

    <div class="panelTitle">
        SICHTSCHUTZ
    </div>

    <button
        id="privacyButton"
        class="danger"
        disabled>
        SICHTSCHUTZ AKTIVIEREN
    </button>

</div>

<div class="panel">

    <div class="panelTitle">
        REGIE LOG
    </div>

    <div
        id="log"
        class="log">
    </div>

</div>

</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://zxaczahnnnztcglsinej.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_K9b2XabV1bJz9oCj7W6eaQ_AtBeXzm4";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

/* =========================================================
   ROOM
========================================================= */

const ROOM =
    "cctv-live-stream";

/* =========================================================
   ELEMENTE
========================================================= */

const statusDot =
    document.getElementById(
        "statusDot"
    );

const statusText =
    document.getElementById(
        "statusText"
    );

const textInput =
    document.getElementById(
        "textInput"
    );

const sendText =
    document.getElementById(
        "sendText"
    );

const privacyButton =
    document.getElementById(
        "privacyButton"
    );

const log =
    document.getElementById(
        "log"
    );

/* =========================================================
   VARIABLEN
========================================================= */

let channel = null;

let connected = false;

let streamOnline = false;

/* =========================================================
   LOG
========================================================= */

function addLog(
    message,
    type=""
){

    const line =
        document.createElement(
            "div"
        );

    line.className =
        "logLine " + type;

    line.textContent =
        "[" +
        new Date()
            .toLocaleTimeString(
                "de-DE"
            ) +
        "] " +
        message;

    log.appendChild(line);

    log.scrollTop =
        log.scrollHeight;
}

/* =========================================================
   STATUS
========================================================= */

function updateStatus(){

    if(!connected){

        statusDot.className =
            "statusDot";

        statusText.textContent =
            "Keine Verbindung";

        sendText.disabled =
            true;

        privacyButton.disabled =
            true;

        return;
    }

    if(!streamOnline){

        statusDot.className =
            "statusDot";

        statusText.textContent =
            "Regie verbunden – Stream ist offline";

        sendText.disabled =
            true;

        privacyButton.disabled =
            true;

        return;
    }

    statusDot.className =
        "statusDot online";

    statusText.textContent =
        "Stream ist online";

    sendText.disabled =
        false;

    privacyButton.disabled =
        false;
}

/* =========================================================
   CHANNEL
========================================================= */

async function connectChannel(){

    channel =
        supabaseClient.channel(
            ROOM,
            {
                config:{
                    broadcast:{
                        self:false
                    }
                }
            }
        );

    channel.on(
        "broadcast",
        {event:"signal"},
        ({payload})=>{

            handleSignal(
                payload
            );

        }
    );

    channel.subscribe(
        async state=>{

            console.log(
                "Supabase:",
                state
            );

            if(
                state ===
                "SUBSCRIBED"
            ){

                connected = true;

                updateStatus();

                addLog(
                    "Regie mit Stream-System verbunden.",
                    "good"
                );

                await sendSignal({
                    type:"status-request"
                });

            }

        }
    );
}

/* =========================================================
   SIGNAL SENDEN
========================================================= */

async function sendSignal(
    payload
){

    if(!channel)return;

    await channel.send({
        type:"broadcast",
        event:"signal",
        payload
    });
}

/* =========================================================
   SIGNAL EMPFANGEN
========================================================= */

function handleSignal(
    message
){

    if(
        !message ||
        !message.type
    )return;

    if(
        message.type ===
        "streamer-online"
    ){

        streamOnline = true;

        updateStatus();

        addLog(
            "Stream ist online.",
            "good"
        );

        return;
    }

    if(
        message.type ===
        "streamer-status"
    ){

        streamOnline =
            message.online === true;

        updateStatus();

        addLog(
            streamOnline
                ? "Stream ist online."
                : "Stream ist offline."
        );

        return;
    }

    if(
        message.type ===
        "streamer-offline"
    ){

        streamOnline = false;

        updateStatus();

        addLog(
            "Stream ist offline."
        );

        return;
    }

}

/* =========================================================
   COMMAND
========================================================= */

async function sendCommand(
    payload
){

    if(!channel)return;

    await channel.send({
        type:"broadcast",
        event:"command",
        payload
    });
}

/* =========================================================
   TEXT
========================================================= */

async function sendTextCommand(
    text
){

    text =
        String(text || "")
        .trim();

    if(!text)return;

    if(!streamOnline){

        addLog(
            "Stream ist offline.",
            "bad"
        );

        return;
    }

    await sendCommand({

        type:"text",

        text

    });

    addLog(
        "Text gesendet: " +
        text,
        "good"
    );
}

/* =========================================================
   TEXT BUTTON
========================================================= */

sendText.addEventListener(
    "click",
    async ()=>{

        await sendTextCommand(
            textInput.value
        );

        textInput.value = "";

    }
);

/* =========================================================
   ENTER
========================================================= */

textInput.addEventListener(
    "keydown",
    async event=>{

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            await sendTextCommand(
                textInput.value
            );

            textInput.value = "";

        }

    }
);

/* =========================================================
   SCHNELLTEXT
========================================================= */

document
.querySelectorAll(
    ".quickText"
)
.forEach(button=>{

    button.addEventListener(
        "click",
        async ()=>{

            await sendTextCommand(
                button.dataset.text
            );

        }
    );

});

/* =========================================================
   SICHTSCHUTZ
========================================================= */

privacyButton.addEventListener(
    "click",
    async ()=>{

        if(!streamOnline){

            addLog(
                "Stream ist offline.",
                "bad"
            );

            return;
        }

        await sendCommand({
            type:"privacy"
        });

        addLog(
            "Sichtschutz aktiviert.",
            "good"
        );

    }
);

/* =========================================================
   START
========================================================= */

updateStatus();

connectChannel();

</script>

</body>
</html>
