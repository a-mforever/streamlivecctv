<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CCTV Regie</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background: #0b0b0b;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

header {

    padding: 20px;

    background: #151515;

    border-bottom:
        1px solid #292929;

}

header h1 {

    margin: 0;

    font-size: 22px;

}

#status {

    margin-top: 7px;

    font-size: 13px;

    color: #ff4444;

}

#status.online {

    color: #20d66a;

}

main {

    width: 100%;

    max-width: 800px;

    margin: auto;

    padding: 20px;

}

.section {

    margin-bottom: 15px;

    padding: 18px;

    background: #151515;

    border:
        1px solid #282828;

    border-radius: 10px;

}

.section h2 {

    margin-top: 0;

    font-size: 17px;

}

textarea {

    width: 100%;

    min-height: 100px;

    resize: vertical;

    padding: 12px;

    border:
        1px solid #333;

    border-radius: 7px;

    background: #090909;

    color: white;

    font-size: 15px;

}

button {

    padding: 11px 15px;

    margin-top: 10px;

    border: 0;

    border-radius: 7px;

    background: #252525;

    color: white;

    cursor: pointer;

    font-weight: bold;

}

button:hover {

    background: #353535;

}

button:disabled {

    opacity: .35;

    cursor: not-allowed;

}

#sendText {

    width: 100%;

    background: #159447;

}

#privacyButton {

    width: 100%;

    padding: 15px;

    background: #c62828;

    font-size: 16px;

}

.quick {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(130px, 1fr)
        );

    gap: 8px;

}

.quick button {

    margin: 0;

}

#log {

    height: 180px;

    overflow-y: auto;

    padding: 12px;

    background: #080808;

    border:
        1px solid #222;

    border-radius: 7px;

    font-family: monospace;

    font-size: 12px;

    color: #aaa;

}

</style>

</head>


<body>


<header>

    <h1>CCTV REGIE</h1>

    <div id="status">
        Stream wird gesucht...
    </div>

</header>


<main>


<div class="section">

    <h2>Text einblenden</h2>

    <textarea
        id="message"
        placeholder="Text für den Stream..."
    ></textarea>

    <button
        id="sendText"
        disabled
    >
        TEXT AN STREAM SENDEN
    </button>

</div>


<div class="section">

    <h2>Schnelltexte</h2>

    <div class="quick">

        <button data-text="BIN GLEICH ZURÜCK">
            BIN GLEICH ZURÜCK
        </button>

        <button data-text="KURZE PAUSE">
            KURZE PAUSE
        </button>

        <button data-text="STREAM LÄUFT">
            STREAM LÄUFT
        </button>

        <button data-text="GLEICH GEHT'S WEITER">
            GLEICH GEHT'S WEITER
        </button>

    </div>

</div>


<div class="section">

    <h2>Sichtschutz</h2>

    <button
        id="privacyButton"
        disabled
    >
        SICHTSCHUTZ AKTIVIEREN
    </button>

</div>


<div class="section">

    <h2>Regie-Log</h2>

    <div id="log"></div>

</div>


</main>


<script>

/* =========================================================
   GLEICHE SENDER-ID WIE IN INDEX.HTML
========================================================= */

const STREAM_PEER_ID =
    "cctv-amforever-live-928374651";


/* =========================================================
   ELEMENTE
========================================================= */

const status =
    document.getElementById("status");

const sendText =
    document.getElementById("sendText");

const privacyButton =
    document.getElementById("privacyButton");

const message =
    document.getElementById("message");

const logBox =
    document.getElementById("log");


/* =========================================================
   VARIABLEN
========================================================= */

let peer = null;

let connection = null;

let retryTimer = null;


/* =========================================================
   LOG
========================================================= */

function log(text) {

    const time =
        new Date()
            .toLocaleTimeString();


    logBox.innerHTML +=
        "[" +
        time +
        "] " +
        text +
        "<br>";


    logBox.scrollTop =
        logBox.scrollHeight;

}


/* =========================================================
   STATUS OFFLINE
========================================================= */

function setOffline() {

    status.textContent =
        "Stream ist nicht online.";

    status.classList.remove(
        "online"
    );


    sendText.disabled =
        true;

    privacyButton.disabled =
        true;

}


/* =========================================================
   STATUS ONLINE
========================================================= */

function setOnline() {

    status.textContent =
        "Stream ist online.";

    status.classList.add(
        "online"
    );


    sendText.disabled =
        false;

    privacyButton.disabled =
        false;

}


/* =========================================================
   PEER STARTEN
========================================================= */

function startRegie() {

    log(
        "Regie wird verbunden..."
    );


    setOffline();


    peer =
        new Peer({
            debug: 1
        });


    peer.on(
        "open",
        id => {

            log(
                "Regie-Peer online."
            );


            connectToStream();

        }
    );


    peer.on(
        "error",
        error => {

            console.error(
                error
            );


            if (
                error.type ===
                "peer-unavailable"
            ) {

                log(
                    "Sender noch nicht online."
                );

            } else {

                log(
                    "PeerJS Fehler: " +
                    error.type
                );

            }


            setOffline();

            retry();

        }
    );


    peer.on(
        "disconnected",
        () => {

            log(
                "Verbindung zu PeerJS getrennt."
            );


            setOffline();

            retry();

        }
    );

}


/* =========================================================
   REGIE -> SENDER
========================================================= */

function connectToStream() {

    log(
        "Suche Stream-Sender..."
    );


    connection =
        peer.connect(
            STREAM_PEER_ID,
            {
                reliable: true,

                serialization: "json",

                metadata: {
                    type: "regie"
                }
            }
        );


    connection.on(
        "open",
        () => {

            log(
                "✓ STREAM-SENDER GEFUNDEN"
            );


            setOnline();

        }
    );


    connection.on(
        "close",
        () => {

            log(
                "Sender-Verbindung geschlossen."
            );


            connection =
                null;


            setOffline();

            retry();

        }
    );


    connection.on(
        "error",
        error => {

            console.error(
                error
            );


            log(
                "Verbindungsfehler."
            );


            setOffline();

        }
    );

}


/* =========================================================
   RETRY
========================================================= */

function retry() {

    if (retryTimer) {
        return;
    }


    retryTimer =
        setTimeout(
            () => {

                retryTimer =
                    null;


                try {

                    if (peer) {
                        peer.destroy();
                    }

                } catch (e) {}


                connection =
                    null;


                startRegie();

            },

            3000
        );

}


/* =========================================================
   TEXT SENDEN
========================================================= */

function sendMessage(text) {

    if (!connection) {

        log(
            "Keine Verbindung zum Stream."
        );

        return;

    }


    if (!connection.open) {

        log(
            "Verbindung noch nicht bereit."
        );

        return;

    }


    text =
        text.trim();


    if (!text) {
        return;
    }


    connection.send({

        type: "text",

        text: text,

        duration: 10000

    });


    log(
        "Text gesendet: " +
        text
    );

}


/* =========================================================
   TEXT BUTTON
========================================================= */

sendText.addEventListener(
    "click",
    () => {

        sendMessage(
            message.value
        );


        message.value =
            "";

    }
);


/* =========================================================
   SCHNELLTEXTE
========================================================= */

document
    .querySelectorAll(
        ".quick button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    sendMessage(
                        button.dataset.text
                    );

                }
            );

        }
    );


/* =========================================================
   SICHTSCHUTZ
========================================================= */

privacyButton.addEventListener(
    "click",
    () => {

        if (!connection) {

            return;

        }


        if (!connection.open) {

            return;

        }


        connection.send({

            type: "privacy",

            duration: 10000

        });


        log(
            "Sichtschutz aktiviert."
        );

    }
);


/* =========================================================
   START
========================================================= */

startRegie();

</script>

</body>
</html>
