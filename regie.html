<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CCTV Regie</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #0b0b0b;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height: 100vh;

}

header {

    padding: 20px;

    background: #151515;

    border-bottom: 1px solid #292929;

}

header h1 {

    margin: 0;

    font-size: 22px;

}

#status {

    margin-top: 7px;

    font-size: 13px;

    color: #aaa;

}

main {

    max-width: 800px;

    margin: auto;

    padding: 20px;

}

.section {

    background: #151515;

    border: 1px solid #282828;

    border-radius: 10px;

    padding: 18px;

    margin-bottom: 15px;

}

.section h2 {

    margin-top: 0;

    font-size: 17px;

}

textarea {

    width: 100%;

    min-height: 100px;

    resize: vertical;

    padding: 12px;

    background: #090909;

    color: white;

    border: 1px solid #333;

    border-radius: 7px;

    font-size: 15px;

}

button {

    border: 0;

    border-radius: 7px;

    padding: 11px 15px;

    margin-top: 10px;

    background: #222;

    color: white;

    cursor: pointer;

    font-weight: bold;

}

button:hover {

    background: #333;

}

button:disabled {

    opacity: .35;

    cursor: not-allowed;

}

#sendText {

    background: #159447;

    width: 100%;

}

#privacyButton {

    background: #c62828;

    width: 100%;

    font-size: 16px;

    padding: 15px;

}

.quick {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(130px, 1fr));

    gap: 8px;

}

.quick button {

    margin: 0;

}

#log {

    background: #080808;

    border: 1px solid #222;

    border-radius: 7px;

    padding: 12px;

    height: 160px;

    overflow-y: auto;

    font-family: monospace;

    font-size: 12px;

    color: #aaa;

}

.online {

    color: #26d467 !important;

}

.offline {

    color: #ff4444 !important;

}

</style>

</head>

<body>

<header>

    <h1>CCTV REGIE</h1>

    <div id="status" class="offline">
        Stream ist nicht online.
    </div>

</header>


<main>


    <div class="section">

        <h2>Text einblenden</h2>

        <textarea
            id="message"
            placeholder="Text für den Stream..."
        ></textarea>

        <button
            id="sendText"
            disabled
        >
            TEXT AN STREAM SENDEN
        </button>

    </div>


    <div class="section">

        <h2>Schnelltexte</h2>

        <div class="quick">

            <button data-text="BIN GLEICH ZURÜCK">
                BIN GLEICH ZURÜCK
            </button>

            <button data-text="KURZE PAUSE">
                KURZE PAUSE
            </button>

            <button data-text="STREAM LÄUFT">
                STREAM LÄUFT
            </button>

            <button data-text="GLEICH GEHT'S WEITER">
                GLEICH GEHT'S WEITER
            </button>

        </div>

    </div>


    <div class="section">

        <h2>Sichtschutz</h2>

        <button
            id="privacyButton"
            disabled
        >
            SICHTSCHUTZ AKTIVIEREN
        </button>

    </div>


    <div class="section">

        <h2>Regie-Log</h2>

        <div id="log"></div>

    </div>


</main>


<script>

const STREAM_ID =
    "amforever-cctv-live-928374";


const status =
    document.getElementById("status");

const sendText =
    document.getElementById("sendText");

const privacyButton =
    document.getElementById("privacyButton");

const message =
    document.getElementById("message");

const logBox =
    document.getElementById("log");


let peer = null;
let connection = null;


/* =========================================================
   LOG
========================================================= */

function log(text) {

    const now =
        new Date().toLocaleTimeString();

    logBox.innerHTML +=
        "[" + now + "] " +
        text +
        "<br>";

    logBox.scrollTop =
        logBox.scrollHeight;

}


/* =========================================================
   PEER START
========================================================= */

function connectRegie() {

    log(
        "Regie-Verbindung gestartet."
    );


    peer = new Peer({

        debug: 1

    });


    peer.on("open", id => {

        log(
            "Regie-Peer online."
        );

        connectToSender();

    });


    peer.on("error", error => {

        console.error(error);

        log(
            "PeerJS Fehler: " +
            error.type
        );

        setOffline();

        retry();

    });


    peer.on("disconnected", () => {

        log(
            "PeerJS getrennt."
        );

        setOffline();

        retry();

    });

}


/* =========================================================
   CONNECT TO STREAM
========================================================= */

function connectToSender() {

    log(
        "Verbinde mit Stream-Sender..."
    );


    connection =
        peer.connect(
            STREAM_ID,
            {
                reliable: true,
                serialization: "json"
            }
        );


    connection.on("open", () => {

        log(
            "✓ STREAM-SENDER GEFUNDEN"
        );

        setOnline();

    });


    connection.on("close", () => {

        log(
            "Stream-Sender getrennt."
        );

        setOffline();

        connection = null;

        retry();

    });


    connection.on("error", error => {

        console.error(error);

        log(
            "Verbindungsfehler."
        );

        setOffline();

    });

}


/* =========================================================
   STATUS
========================================================= */

function setOnline() {

    status.textContent =
        "Stream ist online.";

    status.classList.remove(
        "offline"
    );

    status.classList.add(
        "online"
    );


    sendText.disabled =
        false;

    privacyButton.disabled =
        false;

}


function setOffline() {

    status.textContent =
        "Stream ist nicht online.";

    status.classList.remove(
        "online"
    );

    status.classList.add(
        "offline"
    );


    sendText.disabled =
        true;

    privacyButton.disabled =
        true;

}


/* =========================================================
   RETRY
========================================================= */

let retryTimer = null;

function retry() {

    if (retryTimer) {
        return;
    }

    retryTimer =
        setTimeout(() => {

            retryTimer = null;

            try {

                if (peer) {
                    peer.destroy();
                }

            } catch (e) {}

            connection = null;

            connectRegie();

        }, 3000);

}


/* =========================================================
   SEND TEXT
========================================================= */

function sendMessage(text) {

    if (!connection) {

        log(
            "Keine Verbindung zum Stream."
        );

        return;

    }


    if (!connection.open) {

        log(
            "Verbindung ist noch nicht geöffnet."
        );

        return;

    }


    if (!text.trim()) {

        return;

    }


    connection.send({

        type: "text",

        text: text.trim(),

        duration: 10000

    });


    log(
        "Text gesendet: " +
        text.trim()
    );

}


/* =========================================================
   TEXT BUTTON
========================================================= */

sendText.addEventListener(
    "click",
    () => {

        sendMessage(
            message.value
        );

        message.value = "";

    }
);


/* =========================================================
   QUICK TEXT
========================================================= */

document
    .querySelectorAll(".quick button")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                sendMessage(
                    button.dataset.text
                );

            }
        );

    });


/* =========================================================
   PRIVACY
========================================================= */

privacyButton.addEventListener(
    "click",
    () => {

        if (!connection) {

            return;

        }


        connection.send({

            type: "privacy",

            duration: 10000

        });


        log(
            "Sichtschutz aktiviert."
        );

    }
);


/* =========================================================
   START
========================================================= */

connectRegie();

</script>

</body>
</html>
