<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0">

<title>CCTV Regie</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>


<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    min-height: 100%;

    background: #080808;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body {
    padding: 14px;
}


.container {

    width: 100%;

    max-width: 600px;

    margin: auto;
}


/* HEADER */

.header {

    background: #111;

    border:
        1px solid #292929;

    border-radius: 12px;

    padding: 18px;

    margin-bottom: 14px;
}

.title {

    font-size: 23px;

    font-weight: 900;

    margin-bottom: 7px;
}

.subtitle {

    color: #888;

    font-size: 13px;
}


/* STATUS */

.status {

    display: flex;

    align-items: center;

    gap: 9px;

    margin-top: 15px;

    color: #777;

    font-size: 13px;
}

.statusDot {

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #555;
}

.status.online {

    color: #4bdd72;
}

.status.online .statusDot {

    background: #25dc5b;

    box-shadow:
        0 0 9px
        rgba(37,220,91,.8);
}


/* BOX */

.box {

    background: #111;

    border:
        1px solid #292929;

    border-radius: 12px;

    padding: 17px;

    margin-bottom: 14px;
}

.boxTitle {

    font-size: 14px;

    font-weight: 900;

    margin-bottom: 11px;
}


/* TEXT */

textarea {

    width: 100%;

    min-height: 105px;

    resize: vertical;

    padding: 13px;

    background: #080808;

    color: white;

    border:
        1px solid #333;

    border-radius: 8px;

    outline: none;

    font-family: Arial, sans-serif;

    font-size: 15px;
}

textarea:focus {

    border-color: #666;
}


/* BUTTON */

button {

    width: 100%;

    border: 0;

    border-radius: 8px;

    padding: 14px;

    margin-top: 9px;

    color: white;

    background: #252525;

    cursor: pointer;

    font-size: 14px;

    font-weight: 900;
}

button:hover {

    background: #353535;
}

button:disabled {

    opacity: .45;

    cursor: default;
}


/* SEND */

.send {

    background: #14652b;
}

.send:hover {

    background: #1b8038;
}


/* PRIVACY */

.privacy {

    background: #711d1d;

    font-size: 15px;
}

.privacy:hover {

    background: #902424;
}


/* QUICK */

.quick {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;
}

.quick button {

    margin-top: 0;
}


/* COUNTDOWN */

.countdown {

    margin-top: 12px;

    text-align: center;

    color: #777;

    font-size: 13px;
}

.countdown strong {

    display: block;

    color: white;

    font-size: 25px;

    margin-top: 3px;
}


/* LOG */

.log {

    max-height: 150px;

    overflow-y: auto;

    color: #777;

    font-size: 12px;

    line-height: 1.5;
}

.logEntry {

    padding:
        5px 0;

    border-bottom:
        1px solid #1d1d1d;
}


/* MOBILE */

@media (
    max-width: 450px
) {

    body {
        padding: 9px;
    }

    .quick {

        grid-template-columns:
            1fr;

    }

}

</style>

</head>


<body>


<div class="container">


    <div class="header">

        <div class="title">
            CCTV REGIE
        </div>

        <div class="subtitle">
            Minecraft-Livestream steuern
        </div>


        <div
            id="status"
            class="status">

            <span class="statusDot"></span>

            <span id="statusText">
                Verbindung wird hergestellt...
            </span>

        </div>

    </div>



    <!-- TEXT -->

    <div class="box">

        <div class="boxTitle">
            TEXT EINBLENDEN
        </div>


        <textarea
            id="textInput"
            maxlength="250"
            placeholder="Text für den Stream..."></textarea>


        <button
            id="sendText"
            class="send">

            TEXT FÜR 10 SEKUNDEN EINBLENDEN

        </button>

    </div>



    <!-- SCHNELLTEXTE -->

    <div class="box">

        <div class="boxTitle">
            SCHNELLTEXTE
        </div>


        <div class="quick">

            <button
                data-text="Wir sind gleich wieder da!">

                GLEICH WIEDER DA

            </button>


            <button
                data-text="Kurze Pause">

                KURZE PAUSE

            </button>


            <button
                data-text="Einen Moment bitte...">

                EINEN MOMENT

            </button>


            <button
                data-text="Der Stream geht gleich weiter.">

                STREAM GEHT WEITER

            </button>

        </div>

    </div>



    <!-- SICHTSCHUTZ -->

    <div class="box">

        <div class="boxTitle">
            SICHTSCHUTZ
        </div>


        <button
            id="privacyButton"
            class="privacy">

            STREAM SICHTSCHUTZ · 10 SEKUNDEN

        </button>


        <div
            id="countdown"
            class="countdown">

            Bereit

        </div>

    </div>



    <!-- LOG -->

    <div class="box">

        <div class="boxTitle">
            REGIE-LOG
        </div>


        <div
            id="log"
            class="log">

            <div class="logEntry">
                Regie gestartet.
            </div>

        </div>

    </div>


</div>



<script>


/* =========================================================
   EINSTELLUNGEN
========================================================= */


/*
    MUSS EXAKT DIESELBE ID SEIN
    WIE IN index.html
*/

const STREAM_ID =
    "cctv-live-stream";


/* =========================================================
   ELEMENTE
========================================================= */

const status =
    document.getElementById(
        "status"
    );

const statusText =
    document.getElementById(
        "statusText"
    );

const textInput =
    document.getElementById(
        "textInput"
    );

const sendText =
    document.getElementById(
        "sendText"
    );

const privacyButton =
    document.getElementById(
        "privacyButton"
    );

const countdown =
    document.getElementById(
        "countdown"
    );

const log =
    document.getElementById(
        "log"
    );


/* =========================================================
   PEER
========================================================= */

const peer =
    new Peer();


let connection =
    null;


/* =========================================================
   LOG
========================================================= */

function addLog(
    text
) {

    const entry =
        document.createElement(
            "div"
        );

    entry.className =
        "logEntry";


    const time =
        new Date()
            .toLocaleTimeString(
                "de-DE",
                {
                    hour:
                        "2-digit",

                    minute:
                        "2-digit",

                    second:
                        "2-digit"
                }
            );


    entry.textContent =
        "[" +
        time +
        "] " +
        text;


    log.prepend(
        entry
    );

}


/* =========================================================
   STATUS
========================================================= */

function online() {

    status.classList.add(
        "online"
    );

    statusText.textContent =
        "Mit Stream verbunden";

    sendText.disabled =
        false;

    privacyButton.disabled =
        false;

}


function offline() {

    status.classList.remove(
        "online"
    );

    statusText.textContent =
        "Stream nicht erreichbar";

    sendText.disabled =
        true;

    privacyButton.disabled =
        true;

}


/* =========================================================
   PEER ÖFFNET
========================================================= */

peer.on(
    "open",
    () => {

        addLog(
            "Regie-Verbindung gestartet."
        );


        connectToStream();

    }
);


/* =========================================================
   STREAM VERBINDEN
========================================================= */

function connectToStream() {

    statusText.textContent =
        "Verbinde mit Stream...";


    connection =
        peer.connect(
            STREAM_ID,
            {
                reliable: true,

                serialization: "json"
            }
        );


    connection.on(
        "open",
        () => {

            online();

            addLog(
                "STREAM VERBUNDEN."
            );

        }
    );


    connection.on(
        "close",
        () => {

            offline();

            addLog(
                "Stream-Verbindung beendet."
            );

            /*
                Nach 3 Sekunden erneut versuchen.
            */

            setTimeout(
                connectToStream,
                3000
            );

        }
    );


    connection.on(
        "error",
        error => {

            console.error(
                error
            );

            offline();

        }
    );

}


/* =========================================================
   FEHLER
========================================================= */

peer.on(
    "error",
    error => {

        console.error(
            "PeerJS:",
            error
        );


        if (
            error.type ===
            "peer-unavailable"
        ) {

            statusText.textContent =
                "Stream ist nicht online.";

            setTimeout(
                connectToStream,
                3000
            );

        }

    }
);


/* =========================================================
   BEFEHL SENDEN
========================================================= */

function sendCommand(
    command
) {

    if (
        !connection ||
        !connection.open
    ) {

        addLog(
            "NICHT VERBUNDEN."
        );

        return false;

    }


    connection.send(
        command
    );

    return true;

}


/* =========================================================
   TEXT
========================================================= */

sendText.addEventListener(
    "click",
    () => {

        const text =
            textInput.value.trim();


        if (!text) {

            textInput.focus();

            return;

        }


        const sent =
            sendCommand({

                type:
                    "text",

                text:
                    text,

                duration:
                    10000

            });


        if (!sent) {

            return;

        }


        addLog(
            "Text gesendet: " +
            text
        );


        textInput.value =
            "";

    }
);


/* =========================================================
   SCHNELLTEXTE
========================================================= */

document
    .querySelectorAll(
        "[data-text]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const text =
                        button.dataset.text;


                    const sent =
                        sendCommand({

                            type:
                                "text",

                            text:
                                text,

                            duration:
                                10000

                        });


                    if (!sent) {

                        return;

                    }


                    addLog(
                        "Schnelltext gesendet."
                    );

                }
            );

        }
    );


/* =========================================================
   SICHTSCHUTZ
========================================================= */

privacyButton.addEventListener(
    "click",
    () => {

        const sent =
            sendCommand({

                type:
                    "privacy",

                duration:
                    10000

            });


        if (!sent) {

            return;

        }


        addLog(
            "Sichtschutz aktiviert."
        );


        privacyButton.disabled =
            true;


        let seconds =
            10;


        countdown.innerHTML =
            "Sichtschutz aktiv<br>" +
            "<strong>" +
            seconds +
            "</strong>";


        const timer =
            setInterval(
                () => {

                    seconds--;


                    if (
                        seconds <= 0
                    ) {

                        clearInterval(
                            timer
                        );


                        countdown.textContent =
                            "Sichtschutz beendet";


                        privacyButton.disabled =
                            false;


                        return;

                    }


                    countdown.innerHTML =
                        "Sichtschutz aktiv<br>" +
                        "<strong>" +
                        seconds +
                        "</strong>";

                },
                1000
            );

    }
);


/* =========================================================
   START
========================================================= */

offline();


</script>

</body>
</html>
