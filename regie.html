<!DOCTYPE html>
<html lang="de">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CCTV REGIE</title>

  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      min-height: 100%;

      background: #080808;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    body {

      padding: 20px;

    }


    .container {

      width: 100%;
      max-width: 700px;

      margin: 0 auto;

    }


    h1 {

      margin: 0 0 20px;

      font-size: 28px;

      letter-spacing: 1px;

    }


    .status {

      display: flex;

      align-items: center;

      gap: 10px;

      padding: 14px 16px;

      margin-bottom: 18px;

      background: #111;

      border: 1px solid #292929;

      border-radius: 9px;

    }


    #statusDot {

      width: 11px;
      height: 11px;

      border-radius: 50%;

      background: #e83232;

      box-shadow:
        0 0 8px
        rgba(232,50,50,0.7);

    }


    #statusText {

      font-weight: 700;

    }


    .box {

      padding: 18px;

      margin-bottom: 18px;

      background: #111;

      border: 1px solid #292929;

      border-radius: 9px;

    }


    .label {

      display: block;

      margin-bottom: 9px;

      color: #aaa;

      font-size: 13px;

      font-weight: 700;

    }


    input {

      width: 100%;

      padding: 13px;

      background: #080808;

      color: white;

      border: 1px solid #333;

      border-radius: 7px;

      outline: none;

      font-size: 15px;

    }


    input:focus {

      border-color: #20d95b;

    }


    button {

      border: 0;

      border-radius: 7px;

      padding: 12px 16px;

      margin-top: 10px;

      background: #202020;

      color: white;

      cursor: pointer;

      font-weight: 700;

      font-size: 14px;

    }


    button:hover {

      background: #303030;

    }


    button:disabled {

      opacity: 0.35;

      cursor: not-allowed;

    }


    #sendText {

      width: 100%;

      background: #20d95b;

      color: #000;

    }


    #privacyButton {

      width: 100%;

      padding: 16px;

      background: #e83232;

      color: white;

      font-size: 16px;

    }


    #privacyButton:hover {

      background: #c92727;

    }


    .quick {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 10px;

    }


    .quick button {

      margin: 0;

    }


    #log {

      min-height: 80px;

      max-height: 200px;

      overflow-y: auto;

      padding: 12px;

      background: #050505;

      border: 1px solid #222;

      border-radius: 7px;

      color: #888;

      font-size: 12px;

      line-height: 1.5;

      white-space: pre-wrap;

    }


    .small {

      margin-top: 8px;

      color: #666;

      font-size: 12px;

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    CCTV REGIE
  </h1>


  <div class="status">

    <div id="statusDot"></div>

    <div id="statusText">
      Verbinde mit Stream...
    </div>

  </div>


  <div class="box">

    <span class="label">
      Text auf dem Stream
    </span>


    <input
      id="textInput"
      type="text"
      maxlength="180"
      placeholder="Text eingeben..."
    >


    <button
      id="sendText"
      disabled
    >
      TEXT 10 SEKUNDEN EINBLENDEN
    </button>


    <div class="quick">

      <button
        class="quickButton"
        data-text="LIVE"
      >
        LIVE
      </button>

      <button
        class="quickButton"
        data-text="Bin gleich wieder da."
      >
        BIN GLEICH WIEDER DA
      </button>

      <button
        class="quickButton"
        data-text="Minecraft LIVE"
      >
        MINECRAFT LIVE
      </button>

    </div>

  </div>


  <div class="box">

    <span class="label">
      Stream-Steuerung
    </span>


    <button
      id="privacyButton"
      disabled
    >
      SICHTSCHUTZ
    </button>


    <div class="small">
      Der Stream wird langsam schwarz, zeigt den
      Sichtschutz und kommt anschließend automatisch zurück.
    </div>

  </div>


  <div class="box">

    <span class="label">
      Regie-Log
    </span>


    <div id="log"></div>

  </div>


</div>


<script>

  /*
  ============================================================
  CCTV REGIE
  ============================================================
  */


  const STREAM_ID =
    "a-mforever-cctv-stream-2026";


  let peer =
    null;


  let connection =
    null;


  const statusDot =
    document.getElementById(
      "statusDot"
    );


  const statusText =
    document.getElementById(
      "statusText"
    );


  const textInput =
    document.getElementById(
      "textInput"
    );


  const sendText =
    document.getElementById(
      "sendText"
    );


  const privacyButton =
    document.getElementById(
      "privacyButton"
    );


  const logBox =
    document.getElementById(
      "log"
    );


  /*
  ============================================================
  LOG
  ============================================================
  */

  function log(text) {

    const time =
      new Date()
        .toLocaleTimeString(
          "de-DE"
        );


    logBox.textContent +=
      "[" +
      time +
      "] " +
      text +
      "\n";


    logBox.scrollTop =
      logBox.scrollHeight;

  }


  /*
  ============================================================
  STATUS
  ============================================================
  */

  function setOnline(online) {

    if (online) {

      statusDot.style.background =
        "#20d95b";

      statusDot.style.boxShadow =
        "0 0 8px rgba(32,217,91,0.8)";

      statusText.textContent =
        "Stream ist ONLINE";

      sendText.disabled =
        false;

      privacyButton.disabled =
        false;

    }

    else {

      statusDot.style.background =
        "#e83232";

      statusDot.style.boxShadow =
        "0 0 8px rgba(232,50,50,0.7)";

      statusText.textContent =
        "Stream ist nicht online";

      sendText.disabled =
        true;

      privacyButton.disabled =
        true;

    }

  }


  /*
  ============================================================
  MIT STREAM VERBINDEN
  ============================================================
  */

  function connectToStream() {

    setOnline(false);

    statusText.textContent =
      "Verbinde mit Stream...";


    /*
    Alte Verbindung schließen
    */

    if (connection) {

      try {
        connection.close();
      }
      catch (e) {}

      connection = null;

    }


    if (
      peer &&
      !peer.destroyed
    ) {

      try {
        peer.destroy();
      }
      catch (e) {}

    }


    /*
    Eigene zufällige Peer-ID
    */

    peer =
      new Peer(undefined, {

        debug: 1,

        config: {

          iceServers: [

            {
              urls:
                "stun:stun.l.google.com:19302"
            }

          ]

        }

      });


    peer.on(
      "open",
      function(myId) {

        log(
          "Regie verbunden."
        );


        /*
        Zum festen Streamer verbinden
        */

        connection =
          peer.connect(
            STREAM_ID,
            {
              reliable: true
            }
          );


        connection.on(
          "open",
          function() {

            log(
              "Verbindung zum Stream hergestellt."
            );

            setOnline(true);

          }
        );


        connection.on(
          "close",
          function() {

            log(
              "Stream-Verbindung geschlossen."
            );

            setOnline(false);


            /*
            Automatisch erneut versuchen
            */

            setTimeout(
              connectToStream,
              2500
            );

          }
        );


        connection.on(
          "error",
          function(error) {

            console.error(
              error
            );

            log(
              "Verbindungsfehler."
            );

            setOnline(false);

          }
        );

      }
    );


    peer.on(
      "error",
      function(error) {

        console.error(
          "PeerJS Regie:",
          error
        );


        if (
          error.type ===
          "peer-unavailable"
        ) {

          statusText.textContent =
            "Stream ist nicht online";

          setOnline(false);

          setTimeout(
            connectToStream,
            2500
          );

        }

        else {

          statusText.textContent =
            "Verbindungsfehler";

          setOnline(false);

        }

      }
    );

  }


  /*
  ============================================================
  TEXT SENDEN
  ============================================================
  */

  function sendMessage(text) {

    if (
      !connection ||
      !connection.open
    ) {

      log(
        "Keine Stream-Verbindung."
      );

      return;

    }


    text =
      String(text || "")
        .trim();


    if (!text) {
      return;
    }


    connection.send({

      type: "text",

      text: text

    });


    log(
      "Text gesendet: " +
      text
    );


    textInput.value =
      "";

  }


  /*
  ============================================================
  TEXT BUTTON
  ============================================================
  */

  sendText.addEventListener(
    "click",
    function() {

      sendMessage(
        textInput.value
      );

    }
  );


  /*
  Enter = senden
  */

  textInput.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        sendMessage(
          textInput.value
        );

      }

    }
  );


  /*
  ============================================================
  SCHNELLTEXT
  ============================================================
  */

  document
    .querySelectorAll(
      ".quickButton"
    )
    .forEach(
      function(button) {

        button.addEventListener(
          "click",
          function() {

            sendMessage(
              button.dataset.text
            );

          }
        );

      }
    );


  /*
  ============================================================
  SICHTSCHUTZ
  ============================================================
  */

  privacyButton.addEventListener(
    "click",
    function() {

      if (
        !connection ||
        !connection.open
      ) {

        return;

      }


      connection.send({

        type:
          "privacy"

      });


      log(
        "Sichtschutz aktiviert."
      );

    }
  );


  /*
  ============================================================
  START
  ============================================================
  */

  log(
    "Regie wird gestartet..."
  );


  connectToStream();

</script>

</body>
</html>
