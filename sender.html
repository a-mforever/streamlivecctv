<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Stream Sender</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: min(900px, 94%);
      background: #151515;
      border: 1px solid #303030;
      border-radius: 14px;
      padding: 25px;
    }

    h1 {
      margin-top: 0;
    }

    button {
      background: #2d7d32;
      border: 0;
      color: white;
      padding: 13px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #36963c;
    }

    button.stop {
      background: #a52b2b;
    }

    video {
      width: 100%;
      max-height: 600px;
      margin-top: 20px;
      background: black;
      border-radius: 10px;
      object-fit: contain;
    }

    #status {
      margin-top: 15px;
      color: #aaa;
    }

    .online {
      color: #55dd6a !important;
    }

    .error {
      color: #ff5555 !important;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Minecraft LIVE – Sender</h1>

    <p>
      Starte Minecraft zuerst über CurseForge.
      Danach kannst du hier das Minecraft-Fenster auswählen.
    </p>

    <button id="start">
      Minecraft Stream starten
    </button>

    <button
      id="stop"
      class="stop"
      style="display:none;"
    >
      Stream stoppen
    </button>

    <video
      id="preview"
      autoplay
      muted
      playsinline
    ></video>

    <div id="status">
      Bereit.
    </div>

  </div>


<script>

const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");

const preview = document.getElementById("preview");
const statusText = document.getElementById("status");

let stream = null;


/*
==================================================
STREAM STARTEN
==================================================
*/

startButton.addEventListener("click", async () => {

  try {

    statusText.textContent =
      "Wähle jetzt dein Minecraft-Fenster aus...";

    statusText.className = "";


    /*
      Der Browser öffnet die Auswahl für:

      - gesamten Bildschirm
      - Fenster
      - Browser-Tab

      Du wählst dein Minecraft-Fenster.
    */

    stream = await navigator.mediaDevices.getDisplayMedia({

      video: {
        displaySurface: "window"
      },

      audio: false

    });


    /*
      Lokale Vorschau
    */

    preview.srcObject = stream;


    startButton.style.display = "none";
    stopButton.style.display = "inline-block";


    statusText.textContent =
      "Minecraft wird übertragen.";

    statusText.className =
      "online";


    /*
      Wenn die Bildschirmfreigabe über
      die Browser-Steuerung beendet wird.
    */

    const videoTrack =
      stream.getVideoTracks()[0];

    if (videoTrack) {

      videoTrack.addEventListener(
        "ended",
        stopStream
      );

    }


  } catch (error) {

    console.error(error);

    statusText.textContent =
      "Die Bildschirmfreigabe wurde abgebrochen oder konnte nicht gestartet werden.";

    statusText.className =
      "error";

  }

});


/*
==================================================
STREAM STOPPEN
==================================================
*/

stopButton.addEventListener(
  "click",
  stopStream
);


function stopStream() {

  if (stream) {

    stream.getTracks().forEach(track => {
      track.stop();
    });

    stream = null;

  }


  preview.srcObject = null;

  startButton.style.display = "inline-block";
  stopButton.style.display = "none";


  statusText.textContent =
    "Stream gestoppt.";

  statusText.className = "";

}

</script>

</body>
</html>
